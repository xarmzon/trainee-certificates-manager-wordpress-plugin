<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family:
          DejaVu Sans,
          sans-serif;
      }

      .certificate {
        background-image: url("../../assets/certificate-bg.png");
        background-size: cover;
        background-repeat: no-repeat;

        width: 297mm;
        height: 210mm;
        box-sizing: border-box;
        padding: 10mm;
        border: 8px solid #0e1579;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        overflow: hidden;
      }

      .logo {
        width: 350px;
        margin-top: -120px;
      }

      .title {
        font-size: 42px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 18px;
        margin-bottom: 20px;
      }

      .name {
        font-size: 36px;
        font-weight: bold;
        margin: 20px 0;
      }

      .course {
        font-size: 20px;
        margin-top: 10px;
      }

      .qr {
        margin-top: 20px;
      }

      .qr img {
        width: 84px;
        height: 84px;
        object-fit: contain;
      }

      .cert-number {
        font-size: 12px;
        margin-bottom: 15px;
      }

      .signatures {
        display: flex;
        justify-content: space-between;
      }

      .sig-box img {
        width: 120px;
      }

      .sig-box span {
        display: block;
        margin-top: 5px;
        font-size: 14px;
        font-weight: bold;
        font-style: italic;
      }

      .sig {
        text-align: center;
      }

      .sig-line {
        width: 200px;
        border-top: 1px solid #000;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="certificate">
      <img class="logo" src="$logo" />

      <div class="title">Certificate of Completion</div>

      <div class="subtitle">This certificate is proudly presented to</div>

      <div class="name">$name</div>

      <div class="course">
        For successfully completing the course(s):
        <br /><br />
        <strong>$courses</strong>
      </div>

      <div class="qr">
        <img src="$qr" width="120" />
      </div>

      <div class="cert-number">Certificate Number: $cert</div>

      <div class="signature">
        <div class="sig-box">
          <img src="$signature" />
          <div class="sig-line"></div>
          <span>Director</span>
        </div>
      </div>
    </div>
  </body>
</html>
